<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planet Jumping</title>
<style>
@font-face { font-family: 'SF Pro'; font-weight: 400; src: local('SF Pro'); }
@font-face { font-family: 'SF Pro'; font-weight: 700; src: local('SF Pro Bold'); }
@font-face { font-family: 'SF Pro Thin'; font-weight: 100; src: local('SF Pro Thin'); }
@font-face { font-family: 'Aalto'; font-weight: 400; src: local('Aalto'); }

:root {
  font-family: 'SF Pro', Arial, sans-serif;
  color: #fff;
  background: #090807;
  font-synthesis: none;
}

* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }

.experience {
  position: relative; width: 100%; height: 100%;
  min-height: 540px; overflow: hidden; background: #0a0908;
}

.starfield-canvas {
  position: absolute; inset: 0; z-index: 0;
  width: 100%; height: 100%;
}

.backgrounds, .background, .shade, .transition-layer, .transition-layer video {
  position: absolute; inset: 0; width: 100%; height: 100%;
}
.backgrounds { z-index: 0; }
.background { object-fit: cover; opacity: 0; transition: opacity .8s ease; }
.background.is-visible { opacity: 1; }

.shade {
  z-index: 1;
  background: linear-gradient(to bottom, transparent 52%, rgba(0,0,0,.88) 100%);
  pointer-events: none;
}

.chrome {
  position: absolute; z-index: 4;
  transition: opacity .45s ease, filter .45s ease;
}
.experience.is-transitioning .chrome {
  opacity: 0; filter: blur(8px); pointer-events: none;
}
.experience.is-transitioning .header,
.experience.is-transitioning .planet-list {
  opacity: 1; filter: none; pointer-events: auto;
}
.experience.is-transitioning .shade { opacity: 1; }
.experience.is-committing .background { transition: none !important; }

.transition-layer { display: none; }
.scene-canvas { display: none; }
.loading {
  position: absolute; z-index: 12; left: 50%; bottom: 30px;
  transform: translateX(-50%); opacity: 0;
  font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
  transition: opacity .2s;
}
.experience.is-loading .loading { opacity: .8; }

/* HEADER */
.header {
  left: clamp(18px, 1.95vw, 28px); right: clamp(18px, 1.95vw, 28px);
  top: clamp(18px, 3.1vh, 28px);
  display: flex; justify-content: space-between; align-items: center;
}
.header-actions { margin-left: auto; display: flex; align-items: center; }
.nav {
  display: flex; align-items: center; height: 42px; padding: 4px 5px;
  border: 1px solid rgba(255,255,255,.45);
  background: rgba(255,255,255,.1); backdrop-filter: blur(12px);
  border-radius: 999px;
}
.nav a {
  color: #fff; text-decoration: none; padding: 8px 19px;
  border-radius: 999px; line-height: 1; font-size: 14px;
}
.nav a.active { background: #fff; color: #000; }
.menu {
  height: 42px; padding: 0 20px; border: 0; border-radius: 999px;
  background: #fff; color: #000; cursor: pointer;
  font-family: 'SF Pro', Arial, sans-serif; font-size: 14px;
  margin-left: 8px;
}

/* SIDEBAR */
.planet-list {
  left: clamp(18px, 1.95vw, 28px); top: 50%;
  transform: translateY(-43%);
  display: flex; flex-direction: column; gap: 6px; font-size: 16px;
}
.planet-item { display: flex; align-items: center; min-height: 20px; }
.planet-item.active { font-size: 18px; font-weight: 700; gap: 8px; }
.planet-item.active::before {
  content: ''; width: 16px; height: 16px;
  border-radius: 50%; background: #fff;
}

/* PORTAL */
.portal-wrap {
  left: 50%; top: 50%; width: min(320px, 31vw);
  transform: translate(-50%, -54%); perspective: none;
}
.portal-heading {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 12px; font-size: 16px; opacity: 0;
}
.portal-heading strong { font-size: 18px; margin-left: 8px; }
.portal {
  position: relative; display: block; width: 100%;
  aspect-ratio: 320 / 350; padding: 0; overflow: visible;
  border: 0; border-radius: 90px; background: transparent;
  cursor: pointer; box-shadow: none; transform: none !important;
}
.portal video, .portal img {
  visibility: hidden; position: absolute;
  width: 1px; height: 1px; pointer-events: none;
}
.portal-canvas {
  position: fixed; inset: 0; z-index: 3;
  width: 100%; height: 100%; pointer-events: none;
}

/* CONTENT */
.planet-content {
  left: clamp(28px, 4vw, 58px); right: clamp(28px, 3vw, 44px);
  bottom: clamp(24px, 3vh, 30px);
  display: flex; justify-content: space-between; align-items: flex-end; gap: 40px;
}
.planet-content h1 {
  font-family: Aalto, 'Arial Narrow', sans-serif;
  font-size: clamp(128px, 21.8vw, 314px);
  font-weight: 400; line-height: .72;
  margin: 0 0 -.04em; letter-spacing: 0;
  transform: translateX(-32px); opacity: 0;
}
.planet-content dl {
  width: min(447px, 34vw); margin: 0; font-size: 16px;
}
.fact {
  display: grid; grid-template-columns: 138px 1fr;
  gap: 18px; padding: 8px 0;
  border-bottom: 1px solid rgba(255,255,255,.48); opacity: 0;
}
.fact:last-child { border-bottom: 0; }
.fact dt { font-weight: 700; }
.fact dd { margin: 0; }

/* PRELOADER */
.preloader {
  position: absolute; inset: 0; z-index: 20;
  background: #000; overflow: hidden;
}
.preloader video {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
}
.preloader-shade {
  position: absolute; inset: auto 0 0; height: 35%;
  background: linear-gradient(to bottom, transparent, #000);
}
.preloader.is-background { z-index: 0; }
.preloader.is-background .preloader-shade { opacity: 0; }

.floating-logo {
  position: fixed; z-index: 22;
  left: 50%; top: 50%; width: 59px; height: 58px;
  transform: translate(-50%, -50%);
  will-change: left, top, width, height, transform;
  transition:
    left 2s cubic-bezier(.16,1,.3,1),
    top 2s cubic-bezier(.16,1,.3,1),
    width 2s cubic-bezier(.16,1,.3,1),
    height 2s cubic-bezier(.16,1,.3,1),
    transform 2s cubic-bezier(.16,1,.3,1);
}
.floating-logo.is-docked {
  left: clamp(18px, 1.95vw, 28px); top: clamp(18px, 3.1vh, 28px);
  width: 37px; height: 36px; transform: none;
}
.floating-logo.is-settled { z-index: 5; }

.preloader-count {
  position: fixed; z-index: 22; left: 50%;
  bottom: clamp(22px, 3.1vh, 28px);
  display: flex; align-items: flex-end; gap: 4px;
  transform: translateX(-50%);
  font-family: 'SF Pro', Arial, sans-serif; line-height: 1;
}
.preloader-count > span:first-child {
  font-family: 'SF Pro Thin', 'SF Pro', Arial, sans-serif;
  font-size: 64px; font-weight: 100;
}
.preloader-count .percent { font-size: 24px; padding-bottom: 4px; }
.preloader-count.is-leaving {
  animation: preload-count-out .75s cubic-bezier(.22,1,.36,1) both;
}
@keyframes preload-count-out {
  to { opacity: 0; filter: blur(7px); transform: translate(-50%, -34px); }
}
body:not(.preload-complete) .custom-cursor { opacity: 0 !important; }


/* CUSTOM CURSOR */
html, body, button, a, .portal { cursor: none !important; }
.custom-cursor {
  display: block; position: fixed; left: 0; top: 0; z-index: 100;
  width: 1px; height: 1px; pointer-events: none;
  opacity: 0; transition: opacity .2s ease;
}
.custom-cursor.is-visible { opacity: 1; }
.cursor-dot, .cursor-orbit {
  position: absolute; left: 0; top: 0; border-radius: 50%;
  transform: translate(-50%, -50%);
}
.cursor-dot { width: 12px; height: 12px; background: #fff; }
.cursor-orbit {
  width: 36px; height: 36px; border: 1px solid #fff;
  background: rgba(255,255,255,.4);
  transition: transform .3s cubic-bezier(.22,1,.36,1);
}
.custom-cursor.is-enter .cursor-orbit {
  transform: translate(-50%, -50%) scale(1.16);
}
.cursor-label {
  position: absolute; top: 26px; left: 0;
  transform: translateX(-50%) translateY(-4px);
  font: 16px/1.2 'SF Pro', Arial, sans-serif;
  white-space: nowrap; opacity: 0;
  transition: opacity .2s ease, transform .3s cubic-bezier(.22,1,.36,1);
}
.custom-cursor.is-enter .cursor-label {
  opacity: 1; transform: translateX(-50%) translateY(0);
}

/* ENTRANCE / SWITCH ANIMATIONS */
body:not(.intro-ready) .header,
body:not(.intro-ready) .planet-list,
body:not(.intro-ready) .planet-content h1,
body:not(.intro-ready) .planet-content .fact { opacity: 0; }

.intro-ready .header {
  animation: reveal-down .9s cubic-bezier(.22,1,.36,1) .1s both;
}
.intro-ready .planet-list {
  animation: reveal-side .9s cubic-bezier(.22,1,.36,1) .65s both;
}
.content-revealing h1 {
  animation: title-rise 1.05s cubic-bezier(.16,1,.3,1) both;
}
.content-revealing .fact {
  animation: fact-rise .72s cubic-bezier(.22,1,.36,1) both;
}
.content-revealing .fact:nth-child(1) { animation-delay: .52s; }
.content-revealing .fact:nth-child(2) { animation-delay: .68s; }
.content-revealing .fact:nth-child(3) { animation-delay: .84s; }
.content-revealing .fact:nth-child(4) { animation-delay: 1s; }

.mask-revealing .portal-heading {
  animation: portal-caption .85s cubic-bezier(.22,1,.36,1) both;
}

.planet-list.is-switching .planet-item {
  animation: menu-row .58s cubic-bezier(.22,1,.36,1) both;
}
.planet-list.is-switching .planet-item:nth-child(1) { animation-delay: .02s; }
.planet-list.is-switching .planet-item:nth-child(2) { animation-delay: .05s; }
.planet-list.is-switching .planet-item:nth-child(3) { animation-delay: .08s; }
.planet-list.is-switching .planet-item:nth-child(4) { animation-delay: .11s; }
.planet-list.is-switching .planet-item:nth-child(5) { animation-delay: .14s; }
.planet-list.is-switching .planet-item:nth-child(6) { animation-delay: .17s; }
.planet-list.is-switching .planet-item:nth-child(7) { animation-delay: .2s; }
.planet-list.is-switching .planet-item:nth-child(8) { animation-delay: .23s; }

.planet-list.is-switching .planet-item.active::before {
  animation: active-dot .55s cubic-bezier(.22,1,.36,1) .18s both;
}

@keyframes reveal-down {
  from { opacity: 0; filter: blur(8px); transform: translateY(-18px); }
  to   { opacity: 1; filter: blur(0);   transform: translateY(0); }
}
@keyframes reveal-side {
  from { opacity: 0; filter: blur(8px); transform: translate(-20px, -43%); }
  to   { opacity: 1; filter: blur(0);   transform: translate(0, -43%); }
}
@keyframes title-rise {
  from { opacity: 0; filter: blur(12px); transform: translate(-32px, 42px); }
  to   { opacity: 1; filter: blur(0);    transform: translate(-32px, 0); }
}
@keyframes fact-rise {
  from { opacity: 0; filter: blur(7px); transform: translateY(18px); }
  to   { opacity: 1; filter: blur(0);   transform: translateY(0); }
}
@keyframes portal-caption {
  from { opacity: 0; filter: blur(7px); transform: translateY(22px); }
  to   { opacity: 1; filter: blur(0);   transform: translateY(0); }
}
@keyframes menu-row {
  from { opacity: .35; transform: translateX(-8px); }
  to   { opacity: 1;   transform: translateX(0); }
}
@keyframes active-dot {
  from { opacity: 0; transform: scale(0); }
  to   { opacity: 1; transform: scale(1); }
}

/* RESPONSIVE */
@media (max-width: 900px) {
  .nav { display: none; }
  .portal-wrap { width: min(300px, 48vw); }
  .planet-content h1 { font-size: clamp(105px, 24vw, 190px); }
  .planet-content dl { width: 43vw; }
  .fact { grid-template-columns: 110px 1fr; }
  .planet-list { font-size: 14px; }
  .planet-item.active { font-size: 16px; }
}
@media (max-width: 640px) {
  .experience { min-height: 600px; }
  .planet-list { display: none; }
  .portal-wrap { top: 44%; width: min(260px, 66vw); }
  .planet-content {
    left: 18px; right: 18px; bottom: 18px; display: block;
  }
  .planet-content h1 {
    font-size: clamp(98px, 30vw, 160px); margin-bottom: 20px;
  }
  .planet-content dl { width: 100%; font-size: 13px; }
  .fact { grid-template-columns: 92px 1fr; padding: 5px 0; }
  .portal-heading { font-size: 14px; }
  .portal-heading strong { font-size: 16px; }
  .menu { height: 38px; }
  .portal { border-radius: 70px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition-duration: .01ms !important; }
  .portal { transform: none !important; }
}

</style>
</head>

</main>

  // ── EASING ──
  function easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function animateValue(setter, duration) {
    return new Promise(function (resolve) {
      const start = performance.now();
      function tick(now) {
        let t = Math.min(1, (now - start) / duration);
        setter(easeInOutCubic(t));
        if (t < 1) requestAnimationFrame(tick);
        else resolve();
      }
      requestAnimationFrame(tick);
    });
  }

  // ── RESIZE ──
  function resizeCanvas() {
    const d = Math.min(devicePixelRatio || 1, 2);

    portalCanvas.width = innerWidth * d;
    portalCanvas.height = innerHeight * d;
    portalCanvas.style.width = innerWidth + 'px';
    portalCanvas.style.height = innerHeight + 'px';
    ctx.setTransform(d, 0, 0, d, 0, 0);

    starfieldCanvas.width = innerWidth * d;
    starfieldCanvas.height = innerHeight * d;
    starfieldCanvas.style.width = innerWidth + 'px';
    starfieldCanvas.style.height = innerHeight + 'px';
    sfCtx.setTransform(d, 0, 0, d, 0, 0);

    if (!frozenScene) {
      sceneCanvas.width = innerWidth * d;
      sceneCanvas.height = innerHeight * d;
      sceneCanvas.style.width = innerWidth + 'px';
      sceneCanvas.style.height = innerHeight + 'px';
      sctx.setTransform(d, 0, 0, d, 0, 0);
    }
  }
  window.addEventListener('resize', resizeCanvas);

  // ── DRAW HELPERS ──
  function isMediaReady(el) {
    if (el.tagName === 'VIDEO') {
      return el.readyState >= 2 && el.videoWidth > 0;
    }
    return el.complete && el.naturalWidth > 0;
  }

  function drawCover(target, context) {
    if (!context) context = ctx;
    if (!isMediaReady(target)) return false;
    const mw = target.videoWidth || target.naturalWidth || 1;
    const mh = target.videoHeight || target.naturalHeight || 1;
    const scale = Math.max(innerWidth / mw, innerHeight / mh);
    const w = mw * scale;
    const h = mh * scale;
    try {
      context.drawImage(target, (innerWidth - w) / 2, (innerHeight - h) / 2, w, h);
      return true;
    } catch (e) { return false; }
  }

  function drawShade(context) {
    if (!context) context = ctx;
    const y0 = innerHeight * 0.52;
    const grad = context.createLinearGradient(0, y0, 0, innerHeight);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.88)');
    context.fillStyle = grad;
    context.fillRect(0, y0, innerWidth, innerHeight - y0);
  }

  function tryPlay(video) {
    if (video && video.paused && video.readyState >= 2) {
      video.play().catch(function () {});
    }
  }

  // ── STARFIELD ──
  const stars = [];
  const NUM_STARS = 600;
  function initStars() {
    for (let i = 0; i < NUM_STARS; i++) {
      stars.push({
        x: Math.random(), y: Math.random(),
        r: Math.random() * 1.8 + 0.3,
        brightness: Math.random() * 0.7 + 0.3,
        twinkleSpeed: Math.random() * 2 + 0.5,
        twinkleOffset: Math.random() * Math.PI * 2
      });
    }
  }
  initStars();

  let nebulaCacheCanvas = null;
  let nebulaCacheW = 0, nebulaCacheH = 0;

  function buildNebulaCache(w, h) {
    nebulaCacheCanvas = document.createElement('canvas');
    nebulaCacheCanvas.width = w;
    nebulaCacheCanvas.height = h;
    nebulaCacheW = w; nebulaCacheH = h;
    const nc = nebulaCacheCanvas.getContext('2d');
    const bg = nc.createRadialGradient(w * 0.3, h * 0.4, 0, w * 0.5, h * 0.5, w * 0.8);
    bg.addColorStop(0, '#0d0b12');
    bg.addColorStop(0.5, '#0a0908');
    bg.addColorStop(1, '#060508');
    nc.fillStyle = bg;
    nc.fillRect(0, 0, w, h);
    const nebulae = [
      { x: 0.2, y: 0.3, rx: 0.25, ry: 0.2, color: [180, 60, 40] },
      { x: 0.75, y: 0.6, rx: 0.3, ry: 0.18, color: [40, 50, 120] },
      { x: 0.5, y: 0.15, rx: 0.2, ry: 0.12, color: [60, 30, 90] },
    ];
    for (const n of nebulae) {
      const grad = nc.createRadialGradient(n.x * w, n.y * h, 0, n.x * w, n.y * h, Math.max(n.rx * w, n.ry * h));
      grad.addColorStop(0, 'rgba(' + n.color[0] + ',' + n.color[1] + ',' + n.color[2] + ',0.08)');
      grad.addColorStop(0.5, 'rgba(' + n.color[0] + ',' + n.color[1] + ',' + n.color[2] + ',0.03)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      nc.fillStyle = grad;
      nc.fillRect(0, 0, w, h);
    }
  }

  function drawStarfield(time) {
    const w = innerWidth, h = innerHeight;
    if (!nebulaCacheCanvas || nebulaCacheW !== w || nebulaCacheH !== h) buildNebulaCache(w, h);
    sfCtx.drawImage(nebulaCacheCanvas, 0, 0);
    for (const s of stars) {
      const twinkle = 0.5 + 0.5 * Math.sin(time * 0.001 * s.twinkleSpeed + s.twinkleOffset);
      const alpha = s.brightness * (0.5 + 0.5 * twinkle);
      sfCtx.beginPath();
      sfCtx.arc(s.x * w, s.y * h, s.r, 0, Math.PI * 2);
      sfCtx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
      sfCtx.fill();
    }
    const st = states[current];
    if (st) {
      const pv = planetVisuals[current] || planetVisuals.mars;
      const c = pv.color;
      const glowGrad = sfCtx.createRadialGradient(w * 0.55, h * 0.45, 0, w * 0.55, h * 0.45, w * 0.5);
      glowGrad.addColorStop(0, 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.12)');
      glowGrad.addColorStop(0.3, 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.04)');
      glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
      sfCtx.fillStyle = glowGrad;
      sfCtx.fillRect(0, 0, w, h);
    }
  }

  // ── PROCEDURAL NOISE & MATH ENGINE ──
  function hash2D(x, y) {
    let n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453123;
    return n - Math.floor(n);
  }

  function smoothNoise(x, y) {
    const i = Math.floor(x);
    const j = Math.floor(y);
    const fx = x - i;
    const fy = y - j;
    const u = fx * fx * (3.0 - 2.0 * fx);
    const v = fy * fy * (3.0 - 2.0 * fy);
    const a = hash2D(i, j);
    const b = hash2D(i + 1, j);
    const c = hash2D(i, j + 1);
    const d = hash2D(i + 1, j + 1);
    return a * (1 - u) * (1 - v) + b * u * (1 - v) + c * (1 - u) * v + d * u * v;
  }

  function fbm2D(x, y, octaves, persistence) {
    let total = 0, freq = 1, amp = 1, maxAmp = 0;
    octaves = octaves || 4;
    persistence = persistence || 0.5;
    for (let i = 0; i < octaves; i++) {
      total += smoothNoise(x * freq, y * freq) * amp;
      maxAmp += amp;
      amp *= persistence;
      freq *= 2;
    }
    return total / maxAmp;
  }

  // ── 3D PLANET SPHERE RENDERER ──
  function hash(x, y, seed) {
    let h = seed + x * 374761393 + y * 668265263;
    h = (h ^ (h >> 13)) * 1274126177;
    h = h ^ (h >> 16);
    return (h & 0x7fffffff) / 0x7fffffff;
  }

  function drawPlanet3D(context, cx, cy, radius, planetKey, time) {
    const pv = planetVisuals[planetKey] || planetVisuals.mars;
    const [r, g, b] = pv.color;
    const [ar, ag, ab] = pv.accent;
    const d = radius * 2;
    if (d < 2) return;
    const lightX = cx - radius * 0.35;
    const lightY = cy - radius * 0.35;
    const sphereGrad = context.createRadialGradient(lightX, lightY, radius * 0.05, cx, cy, radius);
    sphereGrad.addColorStop(0, 'rgb(' + Math.min(255, r + 80) + ',' + Math.min(255, g + 80) + ',' + Math.min(255, b + 60) + ')');
    sphereGrad.addColorStop(0.4, 'rgb(' + r + ',' + g + ',' + b + ')');
    sphereGrad.addColorStop(0.75, 'rgb(' + Math.max(0, r - 60) + ',' + Math.max(0, g - 60) + ',' + Math.max(0, b - 50) + ')');
    sphereGrad.addColorStop(1, 'rgb(' + Math.max(0, r - 120) + ',' + Math.max(0, g - 120) + ',' + Math.max(0, b - 100) + ')');
    context.save();
    context.beginPath();
    context.arc(cx, cy, radius, 0, Math.PI * 2);
    context.fillStyle = sphereGrad;
    context.fill();
    // Surface bands
    context.globalCompositeOperation = 'overlay';
    context.globalAlpha = 0.3;
    const bandCount = planetKey === 'jupiter' || planetKey === 'saturn' ? 12 : 5;
    for (let i = 0; i < bandCount; i++) {
      const bandY = cy - radius + (2 * radius * (i + 0.5) / bandCount);
      const bandH = radius * 2 / bandCount;
      const distFromCenter = Math.abs(bandY - cy) / radius;
      const bandWidth = Math.sqrt(1 - distFromCenter * distFromCenter) * radius * 2;
      if (bandWidth <= 0) continue;
      const alpha = hash(i, 0, pv.craterSeed || 3) * 0.25;
      const shade = hash(i, 1, pv.craterSeed || 3) > 0.5 ? 1 : 0;
      context.fillStyle = shade
        ? 'rgba(' + Math.min(255, ar + 40) + ',' + Math.min(255, ag + 40) + ',' + Math.min(255, ab + 30) + ',' + alpha + ')'
        : 'rgba(' + Math.max(0, ar - 40) + ',' + Math.max(0, ag - 40) + ',' + Math.max(0, ab - 30) + ',' + alpha + ')';
      context.fillRect(cx - bandWidth / 2, bandY - bandH / 2, bandWidth, bandH);
    }
    // Craters for rocky planets
    if (pv.craterSeed > 0) {
      context.globalCompositeOperation = 'multiply';
      context.globalAlpha = 0.15;
      for (let i = 0; i < pv.craterSeed * 3; i++) {
        const angle = hash(i, 10, pv.craterSeed) * Math.PI * 2;
        const dist = hash(i, 20, pv.craterSeed) * 0.75;
        const px = cx + Math.cos(angle) * dist * radius;
        const py = cy + Math.sin(angle) * dist * radius;
        const cr = hash(i, 30, pv.craterSeed) * radius * 0.12 + radius * 0.03;
        context.beginPath();
        context.arc(px, py, cr, 0, Math.PI * 2);
        context.fillStyle = 'rgba(0,0,0,0.3)';
        context.fill();
      }
    }
    context.globalCompositeOperation = 'source-over';
    context.globalAlpha = 1;
    // Atmosphere
    if (pv.atmosphere) {
      const [aR, aG, aB, aA] = pv.atmosphere;
      const atmoGrad = context.createRadialGradient(cx, cy, radius * 0.92, cx, cy, radius * 1.25);
      atmoGrad.addColorStop(0, 'rgba(' + aR + ',' + aG + ',' + aB + ',0)');
      atmoGrad.addColorStop(0.5, 'rgba(' + aR + ',' + aG + ',' + aB + ',' + aA + ')');
      atmoGrad.addColorStop(1, 'rgba(' + aR + ',' + aG + ',' + aB + ',0)');
      context.beginPath();
      context.arc(cx, cy, radius * 1.25, 0, Math.PI * 2);
      context.fillStyle = atmoGrad;
      context.fill();
    }
    // Terminator shadow
    const shadowGrad = context.createLinearGradient(cx - radius, cy, cx + radius, cy);
    shadowGrad.addColorStop(0, 'rgba(0,0,0,0)');
    shadowGrad.addColorStop(0.6, 'rgba(0,0,0,0)');
    shadowGrad.addColorStop(0.85, 'rgba(0,0,0,0.4)');
    shadowGrad.addColorStop(1, 'rgba(0,0,0,0.7)');
    context.beginPath();
    context.arc(cx, cy, radius, 0, Math.PI * 2);
    context.fillStyle = shadowGrad;
    context.fill();
    // Specular
    const specGrad = context.createRadialGradient(lightX, lightY, 0, lightX, lightY, radius * 0.6);
    specGrad.addColorStop(0, 'rgba(255,255,255,0.2)');
    specGrad.addColorStop(0.3, 'rgba(255,255,255,0.05)');
    specGrad.addColorStop(1, 'rgba(255,255,255,0)');
    context.beginPath();
    context.arc(cx, cy, radius, 0, Math.PI * 2);
    context.fillStyle = specGrad;
    context.fill();
    // Saturn rings
    if (pv.rings) {
      context.save();
      context.beginPath();
      context.ellipse(cx, cy, radius * 2, radius * 0.5, -0.15, 0, Math.PI * 2);
      context.strokeStyle = 'rgba(' + (r + 20) + ',' + (g + 20) + ',' + (b + 10) + ',0.5)';
      context.lineWidth = radius * 0.15;
      context.stroke();
      context.beginPath();
      context.ellipse(cx, cy, radius * 1.7, radius * 0.42, -0.15, 0, Math.PI * 2);
      context.strokeStyle = 'rgba(' + (r + 40) + ',' + (g + 40) + ',' + (b + 20) + ',0.35)';
      context.lineWidth = radius * 0.08;
      context.stroke();
      context.restore();
    }
    context.restore();
  }

  function drawPortalPlanet(context, cx, cy, w, h, time) {
    const s = states[current];
    const nextPlanetName = s.next.toLowerCase();
    const planetRadius = Math.min(w, h) * 0.35;
    const bgGrad = context.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * 0.7);
    bgGrad.addColorStop(0, '#0e0c14');
    bgGrad.addColorStop(1, '#040308');
    context.fillStyle = bgGrad;
    context.fillRect(0, 0, innerWidth, innerHeight);
    for (let i = 0; i < 40; i++) {
      const sx = cx + (hash(i, 100, 42) - 0.5) * w;
      const sy = cy + (hash(i, 200, 42) - 0.5) * h;
      const sr = hash(i, 300, 42) * 1.2 + 0.3;
      const sa = 0.3 + 0.3 * Math.sin(time * 0.002 * (hash(i, 400, 42) + 0.5));
      context.beginPath();
      context.arc(sx, sy, sr, 0, Math.PI * 2);
      context.fillStyle = 'rgba(255,255,255,' + sa + ')';
      context.fill();
    }
    drawPlanet3D(context, cx, cy + h * 0.05, planetRadius, nextPlanetName, time);
  }

  // ── ROUNDED RECT & PROJECTION ──
  function roundedRectPoints(w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    const pts = [];
    const corners = [
      [w / 2 - r, -h / 2 + r, -Math.PI / 2, 0],
      [w / 2 - r,  h / 2 - r,  0, Math.PI / 2],
      [-w / 2 + r, h / 2 - r,  Math.PI / 2, Math.PI],
      [-w / 2 + r, -h / 2 + r, Math.PI, Math.PI * 1.5]
    ];
    for (const [cx, cy, a0, a1] of corners) {
      for (let i = 0; i <= 10; i++) {
        const a = a0 + (a1 - a0) * (i / 10);
        pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
      }
    }
    return pts;
  }

  function project(x, y, rx, ry, cx, cy) {
    const ax = rx * Math.PI / 180;
    const ay = ry * Math.PI / 180;
    const xx = x * Math.cos(ay);
    const yy = y * Math.cos(ax);
    const z  = x * Math.sin(ay) - y * Math.sin(ax);
    const p  = 850 / (850 + z);
    return [cx + xx * p, cy + yy * p];
  }

  function getPortalMedia() {
    const s = states[current];
    if (s.image) return portalImage;
    return portalVideo;
  }

  // ── MAIN DRAW LOOP ──
  let lastTime = 0;
  function draw(now) {
    requestAnimationFrame(draw);
    const dt = Math.min(now - (lastTime || now), 40);
    lastTime = now;
    drawStarfield(now);
    if (!busy) {
      rotX += (targetX - rotX) * Math.min(1, dt * 0.009);
      rotY += (targetY - rotY) * Math.min(1, dt * 0.009);
    }
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    if (frozenScene) {
      ctx.drawImage(sceneCanvas, 0, 0, innerWidth, innerHeight);
      drawShade(ctx);
    }
    const rect = portalBtn.getBoundingClientRect();
    const rectCx = rect.left + rect.width / 2;
    const rectCy = rect.top + rect.height / 2;
    const e = expansion;
    const cx = rectCx + (innerWidth / 2 - rectCx) * e;
    const cy = rectCy + (innerHeight / 2 - rectCy) * e;
    const baseW = rect.width + (innerWidth - rect.width) * e;
    const baseH = rect.height + (innerHeight - rect.height) * e;
    const scale = e ? 1 : maskScale;
    const w = baseW * scale;
    const h = baseH * scale;
    const r = 90 * (1 - e) * scale;
    const rx = rotX * (1 - e);
    const ry = rotY * (1 - e);
    if (w > 1 && h > 1) {
      const pts = roundedRectPoints(w, h, r);
      const projected = pts.map(function (p) { return project(p[0], p[1], rx, ry, cx, cy); });
      ctx.save();
      ctx.globalAlpha = canvasOpacity;
      ctx.beginPath();
      ctx.moveTo(projected[0][0], projected[0][1]);
      for (let i = 1; i < projected.length; i++) {
        ctx.lineTo(projected[i][0], projected[i][1]);
      }
      ctx.closePath();
      ctx.clip();
      ctx.fillStyle = '#030303';
      ctx.fillRect(0, 0, innerWidth, innerHeight);
      if (transitionActive) {
        if (!drawCover(transitionVid, ctx)) {
          drawPortalPlanet(ctx, cx, cy, w, h, now);
        }
        drawShade(ctx);
      } else {
        const media = getPortalMedia();
        if (!drawCover(media, ctx)) {
          drawPortalPlanet(ctx, cx, cy, w, h, now);
        }
      }
      ctx.restore();
    }
  }

  // ── POINTER TILT ──
  document.addEventListener('pointermove', function (ev) {
    mouseX = ev.clientX;
    mouseY = ev.clientY;
    if (!busy) {
      targetY = (ev.clientX / innerWidth - 0.5) * 37.4;
      targetX = (ev.clientY / innerHeight - 0.5) * -33;
    }
    if (!cursorEl.classList.contains('is-visible')) {
      cursorEl.classList.add('is-visible');
    }
  });
  document.addEventListener('pointerleave', function () {
    targetX = 0; targetY = 0;
    cursorEl.classList.remove('is-visible');
  });

  // ── CURSOR LOOP ──
  function cursorLoop() {
    requestAnimationFrame(cursorLoop);
    orbitX += (mouseX - orbitX) * 0.2;
    orbitY += (mouseY - orbitY) * 0.2;
    cursorDot.style.transform = 'translate3d(' + mouseX + 'px,' + mouseY + 'px,0) translate(-50%,-50%)';
    cursorOrbit.style.transform =
      'translate3d(' + orbitX + 'px,' + orbitY + 'px,0) translate(-50%,-50%)' +
      (cursorEl.classList.contains('is-enter') ? ' scale(1.16)' : '');
  }

  portalBtn.addEventListener('pointerenter', function () { cursorEl.classList.add('is-enter'); });
  portalBtn.addEventListener('pointerleave', function () { cursorEl.classList.remove('is-enter'); });

  // ── VIDEO EVENT HELPERS ──
  document.querySelectorAll('.background').forEach(function (v) {
    v.addEventListener('canplaythrough', function () {
      if (v.classList.contains('is-visible')) tryPlay(v);
    });
    v.addEventListener('canplay', function () {
      if (v.classList.contains('is-visible')) tryPlay(v);
    });
  });
  portalVideo.addEventListener('canplay', function () { tryPlay(portalVideo); });
  portalVideo.addEventListener('canplaythrough', function () { tryPlay(portalVideo); });

  // ── RENDER ──
  function render() {
    const s = states[current];
    experience.dataset.planet = current;
    planetTitle.textContent = s.name.toUpperCase();
    nextName.textContent = s.next;
    nextNumber.textContent = s.number;
    portalBtn.setAttribute('aria-label', 'Travel to ' + s.next);
    factsEl.innerHTML = '';
    for (const [key, val] of s.facts) {
      const div = document.createElement('div');
      div.className = 'fact';
      div.innerHTML = '<dt>' + key + '</dt><dd>' + val + '</dd>';
      factsEl.appendChild(div);
    }
    planetList.innerHTML = '';
    for (const p of allPlanets) {
      const span = document.createElement('span');
      span.className = 'planet-item' + (p.toLowerCase() === s.name.toLowerCase() ? ' active' : '');
      span.textContent = p;
      planetList.appendChild(span);
    }
    if (!firstRender) {
      planetList.classList.remove('is-switching');
      void planetList.offsetWidth;
      planetList.classList.add('is-switching');
    }
    firstRender = false;
    document.querySelectorAll('.background').forEach(function (bg) {
      const shouldShow = bg.id === s.background;
      bg.classList.toggle('is-visible', shouldShow);
      if (shouldShow) { bg.currentTime = 0; tryPlay(bg); }
    });
    if (s.image) {
      portalImage.style.visibility = 'visible';
      portalVideo.style.visibility = 'hidden';
    } else {
      portalImage.style.visibility = 'hidden';
      portalVideo.style.visibility = 'visible';
      if (portalVideo.src !== s.portal) { portalVideo.src = s.portal; portalVideo.load(); }
      tryPlay(portalVideo);
    }
  }

  // ── REVEAL ANIMATIONS ──
  function revealMask() {
    experience.classList.remove('mask-revealing');
    void experience.offsetWidth;
    experience.classList.add('mask-revealing');
    maskScale = 0;
    return animateValue(function (v) { maskScale = v; }, 1050);
  }

  function revealPlanetContent() {
    experience.classList.remove('content-revealing');
    void experience.offsetWidth;
    experience.classList.add('content-revealing');
  }

  // ── START EXPERIENCE ──
  async function startExperience() {
    const s = states[current];
    const media = s.image ? portalImage : portalVideo;
    await new Promise(function (resolve) {
      if (s.image) {
        if (media.complete && media.naturalWidth) resolve();
        else { media.onload = resolve; media.onerror = resolve; setTimeout(resolve, 4000); }
      } else {
        if (portalVideo.readyState >= 2) resolve();
        else {
          portalVideo.addEventListener('canplaythrough', resolve, { once: true });
          portalVideo.addEventListener('canplay', resolve, { once: true });
          portalVideo.addEventListener('error', resolve, { once: true });
          setTimeout(resolve, 4000);
        }
      }
    });
    const bgVid = document.getElementById(s.background);
    if (bgVid) { bgVid.currentTime = 0; try { await bgVid.play(); } catch (e) {} }
    if (!s.image) { try { portalVideo.currentTime = 0; portalVideo.play(); } catch (e) {} }
    await revealMask();
    document.body.classList.add('intro-ready');
    setTimeout(revealPlanetContent, 850);
  }

  // ── PRELOADER ──
  function runPreloader() {
    let finished = false;
    function finish() {
      if (finished) return;
      finished = true;
      preloaderVal.textContent = '100';
      preloaderCnt.classList.add('is-leaving');
      floatingLogo.classList.add('is-docked');
      preloaderEl.classList.add('is-background');
      document.body.classList.add('preload-complete');
      startExperience();
      setTimeout(function () { if (preloaderCnt.parentNode) preloaderCnt.parentNode.removeChild(preloaderCnt); }, 750);
      setTimeout(function () { floatingLogo.classList.add('is-settled'); }, 2000);
    }
    function trackProgress() {
      if (finished) return;
      if (preloaderVid.duration && preloaderVid.duration > 0) {
        const pct = Math.round((preloaderVid.currentTime / preloaderVid.duration) * 100);
        preloaderVal.textContent = String(Math.min(pct, 100));
      }
      if (!preloaderVid.ended) requestAnimationFrame(trackProgress);
    }
    preloaderVid.addEventListener('ended', finish, { once: true });
    function startPreloader() {
      preloaderVid.playbackRate = Math.max(0.25, preloaderVid.duration / 3);
      preloaderVid.play().then(function () { requestAnimationFrame(trackProgress); }).catch(function () { finish(); });
    }
    if (preloaderVid.readyState >= 1) startPreloader();
    else {
      preloaderVid.addEventListener('loadedmetadata', startPreloader, { once: true });
      setTimeout(function () { if (!finished && preloaderVid.readyState < 1) finish(); }, 5000);
    }
  }

  // ── TRAVEL ──
  portalBtn.addEventListener('click', travel);

  async function travel() {
    if (busy || current === 'venus') return;
    busy = true;
    targetX = 0; targetY = 0;
    const next = current === 'mars' ? 'earth' : 'venus';
    try {
      transitionVid.src = states[current].portal;
      transitionVid.load();
      experience.classList.add('is-loading');
      await new Promise(function (resolve) {
        let resolved = false;
        function done() { if (!resolved) { resolved = true; resolve(); } }
        transitionVid.addEventListener('canplaythrough', done, { once: true });
        transitionVid.addEventListener('error', done, { once: true });
        setTimeout(done, 1600);
      });
      experience.classList.remove('is-loading');
      experience.classList.remove('content-revealing');
      experience.classList.remove('mask-revealing');
      experience.classList.add('is-transitioning');
      transitionVid.currentTime = 0;
      transitionVid.playbackRate = 1.3;
      canvasOpacity = 1;
      transitionActive = true;
      try { await transitionVid.play(); } catch (e) {}
      await animateValue(function (v) { expansion = v; }, 1100);
      await new Promise(function (resolve) {
        if (transitionVid.ended) { resolve(); return; }
        transitionVid.addEventListener('ended', resolve, { once: true });
        setTimeout(resolve, 8000);
      });
      frozenScene = true;
      const d = Math.min(devicePixelRatio || 1, 2);
      sceneCanvas.width = innerWidth * d;
      sceneCanvas.height = innerHeight * d;
      sceneCanvas.style.width = innerWidth + 'px';
      sceneCanvas.style.height = innerHeight + 'px';
      sctx.setTransform(d, 0, 0, d, 0, 0);
      sctx.clearRect(0, 0, innerWidth, innerHeight);
      drawCover(transitionVid, sctx);
      current = next;
      experience.classList.add('is-committing');
      render();
      await new Promise(function (r) { requestAnimationFrame(function () { requestAnimationFrame(r); }); });
      transitionActive = false;
      expansion = 0;
      maskScale = 0;
      canvasOpacity = 1;
      experience.classList.remove('is-transitioning');
      experience.classList.remove('is-committing');
      const bgVid = document.getElementById(states[current].background);
      if (bgVid) { bgVid.currentTime = 0; try { await bgVid.play(); } catch (e) {} }
      if (!states[current].image) { try { portalVideo.currentTime = 0; portalVideo.play(); } catch (e) {} }
      const maskRevealP = revealMask();
      setTimeout(revealPlanetContent, 100);
      await maskRevealP;
      frozenScene = false;
      setTimeout(function () { transitionVid.removeAttribute('src'); transitionVid.load(); busy = false; }, 450);
    } catch (err) {
      console.warn('Travel error:', err);
      transitionActive = false; expansion = 0; maskScale = 1; canvasOpacity = 1;
      frozenScene = false;
      experience.classList.remove('is-transitioning');
      experience.classList.remove('is-committing');
      experience.classList.remove('is-loading');
      busy = false;
    }
  }

  // ── BOOT ──
  document.querySelectorAll('.background').forEach(function (v) {
    v.pause();
    v.currentTime = 0;
  });

  resizeCanvas();
  render();
  requestAnimationFrame(draw);
  requestAnimationFrame(cursorLoop);
  runPreloader();

})();
</script>
</body>
</html>
