<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="chromeOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#cccccc" />
      <stop offset="50%" stop-color="#666666" />
      <stop offset="70%" stop-color="#dddddd" />
      <stop offset="100%" stop-color="#333333" />
    </linearGradient>
    <linearGradient id="chromeInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#888888" />
    </linearGradient>
  </defs>

  <!-- Outer Bezel -->
  <circle cx="50" cy="50" r="48" fill="#000000" stroke="url(#chromeOuter)" stroke-width="2.5" />

  <!-- Black Typography Ring -->
  <circle cx="50" cy="50" r="45" fill="#000000" />

  <!-- Inner Silver Border -->
  <circle cx="50" cy="50" r="28" fill="none" stroke="url(#chromeInner)" stroke-width="1.8" />

  <!-- Bavarian Blue & White Quadrants -->
  <g clip-path="url(#centerClip)">
    <clipPath id="centerClip">
      <circle cx="50" cy="50" r="27" />
    </clipPath>
    <!-- Top-Left: Bavarian Blue -->
    <path d="M50 23 A27 27 0 0 0 23 50 L50 50 Z" fill="#0066B1" />
    <!-- Top-Right: Pure White -->
    <path d="M50 23 A27 27 0 0 1 77 50 L50 50 Z" fill="#FFFFFF" />
    <!-- Bottom-Right: Bavarian Blue -->
    <path d="M77 50 A27 27 0 0 1 50 77 L50 50 Z" fill="#0066B1" />
    <!-- Bottom-Left: Pure White -->
    <path d="M50 77 A27 27 0 0 1 23 50 L50 50 Z" fill="#FFFFFF" />
  </g>

  <!-- Precision Silver Crosshairs -->
  <line x1="50" y1="22" x2="50" y2="78" stroke="#d1d5db" stroke-width="1.2" />
  <line x1="22" y1="50" x2="78" y2="50" stroke="#d1d5db" stroke-width="1.2" />

  <!-- Official BMW Letterforms -->
  <!-- 'B' -->
  <text x="29" y="32" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="900" text-anchor="middle" transform="rotate(-38 29 32)">B</text>

  <!-- 'M' -->
  <text x="50" y="19" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="900" text-anchor="middle">M</text>

  <!-- 'W' -->
  <text x="71" y="32" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="900" text-anchor="middle" transform="rotate(38 71 32)">W</text>
</svg>
